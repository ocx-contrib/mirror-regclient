extends: ../mirror-base.yml

name: regsync

# Logical index package `regclient/regsync` at the physical path
# `ghcr.io/ocx-contrib/regclient/regsync` — slash segments, never
# hyphen-flattened. The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
#
# Succeeds the flat `ocx.sh/regclient/regsync` coordinate this repository
# published as a single-package mirror, the same way mirror-kitware/cmake
# succeeds mirror-cmake.
target:
  registry: ghcr.io
  repository: ocx-contrib/regclient/regsync

source:
  type: github_release
  owner: regclient
  repo: regclient
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# regsync is a pure-Go binary built without cgo, so upstream ships ONE Linux
# build per arch and it is fully static. Measured on v0.11.5:
#
#   $ file regsync-linux-amd64
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, stripped
#   $ readelf -l regsync-linux-amd64 | grep INTERP  → (none)
#   $ readelf -d regsync-linux-amd64 | grep NEEDED  → (none)
#   $ file regsync-linux-arm64
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked, stripped
#   … same: no INTERP segment, no NEEDED entries
#
# No PT_INTERP and no DT_NEEDED means the artifact requires nothing of the
# host, so both Linux keys are BARE — no `+libc.*` suffix, and no glibc
# counterpart to split against. Container legs (ubuntu + alpine + fedora) live
# in ../mirror-base.yml and are what turn that claim into evidence.
#
# ─── Scope (verified at v0.9.0 — the floor — v0.10.0, v0.11.0 and v0.11.5) ──
#
# One release carries all three tools' binaries side by side, so anchoring is
# what keeps regctl and regbot out of this spec. Upstream also publishes, and
# this mirror deliberately does not carry:
#   regsync-linux-ppc64le, regsync-linux-riscv64, regsync-linux-s390x — no GHA runner
#   regsync-freebsd-amd64                        — outside the OCX platform set
#   metadata.tgz                                 — sidecar, not a bundle
#
# There is no regsync-windows-arm64.exe at any version in range — hence no
# windows/arm64 key. A declared platform matching zero assets is SILENTLY
# skipped, not an error, so it would have read green while publishing nothing.
#
# Resolution verified BOTH ways at all four versions: each of the five patterns
# matches EXACTLY one asset.
assets:
  linux/amd64:
    - "^regsync-linux-amd64$"
  linux/arm64:
    - "^regsync-linux-arm64$"
  darwin/amd64:
    - "^regsync-darwin-amd64$"
  darwin/arm64:
    - "^regsync-darwin-arm64$"
  windows/amd64:
    - "^regsync-windows-amd64\\.exe$"

asset_type:
  # Raw binary on every platform — no archive to unpack. Renamed to `regsync`
  # (regsync.exe on Windows; the .exe is appended automatically when the
  # downloaded asset carries it).
  type: binary
  name: regsync

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>, and a raw-binary
# mirror has none — the executable IS the content root. `verify` or `auto`
# would be rejected at spec load with exit 65. `off` with a hand-listed
# `binaries` in metadata.json is the blessed shape for this asset type.
bin_scan: off

metadata:
  # One file for every platform: a single `regsync` executable at the content
  # root, PATH = ${installPath}.
  default: metadata.json

catalog:
  # Beside the spec — `catalog.logo` and `metadata.default` resolve against
  # this spec's own directory, unlike `tests[].script` below.
  logo: logo.svg

versions:
  # v0.9.0 is the oldest release carrying GitHub per-asset digests (v0.8.0 and
  # older have none), which verify.github_asset_digest requires.
  min: "0.9.0"
  new_per_run: 5
  # Staggered off the sibling specs (regctl :10, regbot :15) so the three
  # mirrors here do not all poll on the same minute — one upstream, three
  # pollers.
  poll_interval: "30 0-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — the opposite of
  # `metadata.default` and `catalog.logo` above.
  - name: smoke
    script: regsync/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/regclient/regclient/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: regclient/regsync
  fork: ocx-contrib/index
